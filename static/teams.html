<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EHL | Franchises</title><style>body{background:#081523;color:#ecf5ff;font:16px system-ui;margin:0}header,main{padding:22px;max-width:1100px;margin:auto}header{border-bottom:2px solid #37c7e8}a{color:#65d8f2}select{background:#173c54;color:white;padding:10px;border-radius:8px}#roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{border:1px solid #31536a;border-radius:12px;background:#10283d;padding:12px}.avatar{height:175px}.muted{color:#b1c6d5}.swatch{display:inline-block;width:20px;height:20px;border:1px solid #fff6;vertical-align:middle}</style></head><body><header><strong>ELITE HOCKEY LEAGUE</strong> / FRANCHISES</header><main><p><a href="/">League home</a> · <a href="/create.html">Create athlete</a></p><h1>Team identity & roster</h1><label for="team">Franchise </label><select id="team"></select><h2 id="name"></h2><p id="colors"></p><section id="roster"></section><p id="status" role="status"></p></main><script src="/avatar.js"></script><script>const $=x=>document.getElementById(x);let brands={};async function load(){try{let r=await fetch('/api/team/roster?team='+encodeURIComponent($('team').value));if(!r.ok)throw Error('Initialize the league first');let d=await r.json(),b=d.team;$('name').textContent=b.name;$('colors').innerHTML='Primary <span class="swatch" style="background:'+b.primary+'"></span> · Secondary <span class="swatch" style="background:'+b.secondary+'"></span>';$('roster').replaceChildren();for(let p of d.players){let c=document.createElement('article');c.className='card';let v=document.createElement('div');v.className='avatar';EHLAvatar.draw(v,p.appearance,{team:b.code,number:p.number});let title=document.createElement('strong');title.textContent=p.name||'Athlete';let meta=document.createElement('p');meta.className='muted';meta.textContent=(p.position||'')+' · #'+(p.number??'—')+(p.human?' · Human':' · CPU');c.append(v,title,meta);if(p.human){let a=document.createElement('a');a.href='/player.html?id='+p.id;a.textContent='View career';c.append(a)}$('roster').append(c)}$('status').textContent=d.players.length+' rostered athletes'}catch(e){$('status').textContent=e.message}}async function init(){let r=await fetch('/api/teams/branding'),d=await r.json();brands=d.teams;for(let b of Object.values(brands)){let o=document.createElement('option');o.value=b.code;o.textContent=b.name;$('team').append(o)}$('team').onchange=load;load()}init();</script></body></html>

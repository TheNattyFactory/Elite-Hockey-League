<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EHL | Create Athlete</title><style>*{box-sizing:border-box}body{margin:0;background:#081523;color:#eef7fb;font:16px system-ui}header{background:#10273b;border-bottom:2px solid #3ac5df;padding:20px 5%;font-weight:800}main{max-width:1050px;margin:28px auto;padding:0 18px}a{color:#61d9f1}.layout{display:grid;grid-template-columns:minmax(210px,320px) 1fr;gap:20px}.card{border:1px solid #31536a;border-radius:16px;padding:20px;background:#10283d}.preview{aspect-ratio:240/270;max-width:280px;margin:auto}label{display:block;margin:12px 0 5px;color:#c5d8e4}input,select,button{width:100%;padding:11px;border:1px solid #537b90;border-radius:8px;background:#173c54;color:white;font:inherit}button{background:#087f9d;cursor:pointer;margin-top:20px}button:disabled{opacity:.6}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.muted{color:#a7bfce}#message{min-height:24px}@media(max-width:650px){.layout{grid-template-columns:1fr}.preview{max-width:180px}}</style></head><body><header>ELITE HOCKEY LEAGUE / CREATE ATHLETE</header><main><p><a href="/">← League home</a></p><div class="layout"><section class="card"><div class="preview" id="avatar"></div><p class="muted">One portrait renderer across creator and player profile.</p></section><section class="card"><h1>Create your hockey career</h1><label for="name">Athlete name</label><input id="name" maxlength="48" placeholder="First and last name" required><div class="choices"><div><label for="team">Franchise</label><select id="team"><option value="ATL">Atlanta Firebirds</option><option value="BOS">Boston Admirals</option><option value="CHI">Chicago Railers</option><option value="DAL">Dallas Stampede</option><option value="DEN">Denver Summit</option><option value="DET">Detroit Forge</option><option value="MIN">Minneapolis Frost</option><option value="NSH">Nashville Copperheads</option></select></div><div><label for="position">Position</label><select id="position"><option>C</option><option>LW</option><option>RW</option><option>D</option><option>G</option></select></div></div><h2>Appearance</h2><div class="choices" id="choices"></div><button id="create">Create athlete</button><p class="muted">Local Genesis prototype: no account login yet. The league must be initialized first.</p><p id="message" role="status"></p></section></div></main><script src="/avatar.js"></script><script>
const $=id=>document.getElementById(id);let opts={},look={...EHLAvatar.defaults};async function init(){let r=await fetch('/api/appearance/options'),j=await r.json();opts=j.options;for(let [k,vals] of Object.entries(opts)){let div=document.createElement('div'),label=document.createElement('label'),sel=document.createElement('select');label.textContent=k.replaceAll('_',' ');sel.id='a_'+k;for(let v of vals){let op=document.createElement('option');op.value=v;op.textContent=v;sel.append(op)}sel.value=look[k];sel.onchange=()=>{look[k]=sel.value;EHLAvatar.draw($('avatar'),look)};div.append(label,sel);$('choices').append(div)}EHLAvatar.draw($('avatar'),look)}
$('create').onclick=async()=>{let b=$('create');b.disabled=true;try{let r=await fetch('/api/sign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value.trim(),team:$('team').value,position:$('position').value,appearance:look})}),j=await r.json();if(!r.ok)throw Error(j.error||'Could not create athlete');let p=j.signed;$('message').textContent='Athlete created! Opening player profile…';location.href='/player.html?id='+encodeURIComponent(p.id)}catch(e){$('message').textContent=e.message}finally{b.disabled=false}};init().catch(e=>$('message').textContent=e.message);
</script></body></html>
